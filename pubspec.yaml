name: titus_assignment
description: "Vehicle Number Plate Recognition System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Camera
  camera: ^0.10.6

  # OCR - Google ML Kit
  google_mlkit_text_recognition: ^0.13.1

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Utilities
  intl: ^0.19.0
  image: ^4.2.0
  share_plus: ^10.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
